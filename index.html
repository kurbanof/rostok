acts.decorToggle = el => { const k = el.dataset.val, l = S.settings.decorOff, i = l.indexOf(k); if (i >= 0) l.splice(i, 1); else l.push(k); save(); render(); };

// настройки
acts.setGame = el => { A.setSetting(S, { game: el.dataset.val === '1' }, nowTs()); save(); toast({ icon: 'check', text: 'Игровой режим включён', sub: 'Опыт и достижения были пересчитаны из твоей истории', ttl: 3500 }); render(); };
acts.toggleGame = () => {
  const on = !S.settings.game; A.setSetting(S, { game: on }, nowTs()); save();
  toast({ icon: 'check', text: on ? 'Игровой режим включён' : 'Включён спокойный трекер', sub: on ? '' : 'Все данные сохранены', ttl: 3500 });
  if (!on && ['garden', 'quests', 'awards'].indexOf(ui.route.name) >= 0) go('home'); else render();
};
acts.toggleStreaks = () => { S.settings.showStreaks = !S.settings.showStreaks; save(); render(); };
acts.setTheme = el => { setTheme(el.dataset.val); save(); render(); };
acts.setMotion = el => { S.settings.motion = el.dataset.val; save(); render(); };
acts.setWeek = el => { A.setSetting(S, { weekStart: +el.dataset.val }, nowTs()); save(); render(); };
acts.toggleNotify = async () => {
  if (S.settings.notify) { S.settings.notify = false; save(); render(); return; }
  if (typeof Notification === 'undefined') { toast({ icon: 'info', text: 'Уведомления недоступны в этом браузере' }); return; }
  let p = Notification.permission;
  if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) { p = 'denied'; } }
  if (p === 'granted') { S.settings.notify = true; save(); toast({ icon: 'check', text: 'Напоминания включены', sub: 'Они приходят, пока приложение открыто', ttl: 4000 }); }
  else toast({ icon: 'info', text: 'Браузер не разрешил уведомления', sub: 'Разрешение можно выдать в настройках сайта' });
  render();
};

// данные
acts.exportJson = () => saveFile('rostok-kopiya-' + X.today + '.json', E.exportJSON(S), 'application/json');
acts.exportCsv = () => saveFile('rostok-vypolneniya-' + X.today + '.csv', '﻿' + E.csvCompletions(S), 'text/csv');
acts.importOpen = () => openSheet({ type: 'import', text: '', err: '', preview: null, data: null });
acts.importCheck = () => {
  const s = ui.sheet; if (!s) return;
  const ta = $('#imp-text'); s.text = ta ? ta.value : s.text;
  if (!s.text.trim()) { s.err = 'Выбери файл или вставь текст копии.'; s.preview = null; layerSig = ''; renderLayer(); return; }
  try { const data = E.importJSON(s.text); s.data = data; s.preview = counts(data); s.err = ''; }
  catch (e) { s.err = e.message || 'Не получилось прочитать копию.'; s.preview = null; s.data = null; }
  layerSig = ''; renderLayer();
};
acts.importApply = () => {
  const s = ui.sheet; if (!s || !s.data) return;
  S = s.data; S.onboarded = true; E.commit(S, nowTs()); setTheme(S.settings.theme); flush();
  ui.sheet = null; ui.draft = null; ui.review = null; renderLayer(); lastDay = null; tick(true);
  toast({ icon: 'check', text: 'Данные восстановлены', sub: counts(S).habits + ' ' + plural(counts(S).habits, ['привычка', 'привычки', 'привычек']), kind: 'good' });
  go('home');
};
acts.demoOpen = () => confirmDlg({
  title: 'Загрузить пример данных?', text: 'Приложение заполнится примером за шесть недель: привычки, пропуски, возвращения, обзоры. <b>Твои текущие данные будут заменены.</b> Если они нужны, сначала сохрани копию.', ok: 'Заменить примером', danger: true,
  run: () => { const nm = S.settings.name; S = buildDemo(nowTs(), S.settings.tz, nm); setTheme(S.settings.theme); flush(); lastDay = null; tick(true); toast({ icon: 'check', text: 'Пример загружен', sub: 'Вернуться к чистому состоянию можно в настройках', ttl: 5000 }); go('home'); }
});
acts.resetOpen = () => confirmDlg({
  title: 'Стереть все данные?', text: 'Привычки, история, опыт и настройки на этом устройстве будут удалены без возможности вернуть. Сначала можно сохранить копию.', ok: 'Стереть всё', danger: true,
  run: () => {
    try { localStorage.removeItem(KEY); } catch (e) { /* хранилище недоступно */ }
    let tz = S.settings.tz; S = E.newState(nowTs(), tz); setTheme('auto'); flush(); ui.review = null; lastDay = null; tick(true);
    go('home'); wizardInit(); openSheet({ type: 'wizard' });
  }
});

/* ---------- облачная копия (необязательно) ---------- */
async function cloudCtx() {
  if (!window.claude || !window.claude.use) return null;
  try {
    const db = await window.claude.use('db'), user = await window.claude.use('user');
    if (!db || !user) return null;
    const id = await user.id(); if (!id) return null;
    return { db, root: db.doc('data/users/' + id + '/backup') };
  } catch (e) { return null; }
}
const CHUNK = 90000;
acts.cloudSave = async () => {
  const c = await cloudCtx();
  if (!c) { toast({ icon: 'info', text: 'Облачная копия сейчас недоступна', sub: 'Нужен вход в аккаунт Claude. Локальную копию можно сохранить файлом.' }); return; }
  try {
    const text = E.exportJSON(S), n = Math.ceil(text.length / CHUNK);
    let old = 0; try { const prev = await c.root.get(); if (prev.exists) old = (prev.data() || {}).n || 0; } catch (e) { /* первой копии нет */ }
    for (let k = 0; k < n; k++) await c.root.collection('parts').doc('p' + k).set({ k, text: text.slice(k * CHUNK, (k + 1) * CHUNK) });
    for (let k = n; k < old; k++) await c.root.collection('parts').doc('p' + k).delete();
    await c.root.set({ n, size: text.length, at: nowTs(), habits: counts(S).habits, completions: counts(S).completions });
    toast({ icon: 'check', text: 'Копия сохранена в облако', sub: 'Видна только тебе', kind: 'good' });
  } catch (e) { toast({ icon: 'info', text: 'Не получилось сохранить в облако', sub: (e && e.code) || '' }); }
};
acts.cloudLoad = async () => {
  const c = await cloudCtx();
  if (!c) { toast({ icon: 'info', text: 'Облачная копия сейчас недоступна', sub: 'Нужен вход в аккаунт Claude.' }); return; }
  try {
    const head0 = await c.root.get();
    if (!head0.exists) { toast({ icon: 'info', text: 'Облачной копии пока нет' }); return; }
    const meta = head0.data(); let text = '';
    for (let k = 0; k < meta.n; k++) { const p = await c.root.collection('parts').doc('p' + k).get(); text += (p.data() || {}).text || ''; }
    openSheet({ type: 'import', text, err: '', preview: null, data: null });
    acts.importCheck();
  } catch (e) { toast({ icon: 'info', text: 'Не получилось загрузить копию', sub: (e && e.code) || '' }); }
};

/* ---------- формы ---------- */
const forms = {
  note: f => { const ta = f.querySelector('textarea'); if (!ta.value.trim()) return; const rep = A.addIdentityNote(S, f.dataset.id, ta.value, nowTs()); save(); toast({ icon: 'check', text: 'Заметка записана', ttl: 2500 }); notifyRep(rep); render(); },
  env: f => {
    const text = $('#env-text').value.trim(); if (!text) { toast({ icon: 'info', text: 'Опиши задачу словами', ttl: 2500 }); $('#env-text').focus(); return; }
    const rep = A.addEnv(S, { kind: ui.envKind || 'cue', text, habitId: $('#env-habit').value || null }, nowTs());
    after(rep, 'Задача добавлена');
  },
  score: f => { const i = $('#score-text'); if (!i.value.trim()) return; A.addScore(S, i.value); save(); render(); const n = $('#score-text'); if (n) n.focus(); }
};

/* ---------- слушатели ---------- */
document.addEventListener('click', e => {
  const t = e.target && e.target.closest ? e.target.closest('[data-act],[data-go]') : null;
  if (!t) return;
  if (t.dataset.act) {
    const fn = acts[t.dataset.act]; if (!fn) return;
    if (t.tagName === 'A') e.preventDefault();
    let a = {}; if (t.dataset.args) { try { a = JSON.parse(t.dataset.args); } catch (x) { a = {}; } }
    if (t.dataset.toast && t.dataset.act !== 'toastClose') dismissToast(t.dataset.toast);
    try { fn(t, a, e); } catch (err) { if (window.console) console.error(err); toast({ icon: 'info', text: 'Что-то пошло не так', sub: esc(err && err.message) }); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
  e.preventDefault(); go(t.dataset.go);
});
function onField(e) {
  const t = e.target; if (!t || !t.dataset) return;
  const d = t.dataset;
  if (d.bind !== undefined && ui.draft) { ui.draft[d.bind] = t.value; if (ui.sheet && ui.sheet.type === 'habit') updatePreview(); }
  else if (d.bindMap && ui.draft) { ui.draft[d.bindMap][d.k] = t.value; }
  else if (d.rev && ui.review) {
    const v = d.rev === 'feel' || d.rev === 'energy' ? +t.value : t.value; ui.review[d.rev] = v;
    if (d.rev === 'feel' || d.rev === 'energy') { const o = $('#out-' + d.rev); if (o) o.textContent = v + ' из 5'; }
  }
  else if (d.wz && ui.wizard) ui.wizard[d.wz] = t.value;
  else if (d.set === 'name') { S.settings.name = t.value; save(); }
  else if (t.id === 'imp-text' && ui.sheet && ui.sheet.type === 'import') { ui.sheet.text = t.value; }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => {
  const t = e.target; onField(e);
  if (t && t.dataset && t.dataset.set === 'tz') { A.setSetting(S, { tz: t.value }, nowTs()); save(); lastDay = null; tick(true); render(); }
  if (t && t.id === 'imp-file' && t.files && t.files[0]) {
    const f = t.files[0], r = new FileReader();
    r.onload = () => { if (ui.sheet && ui.sheet.type === 'import') { ui.sheet.text = String(r.result || ''); acts.importCheck(); } };
    r.onerror = () => { if (ui.sheet) { ui.sheet.err = 'Не удалось прочитать файл.'; layerSig = ''; renderLayer(); } };
    r.readAsText(f);
  }
});
document.addEventListener('submit', e => { const f = e.target && e.target.closest ? e.target.closest('[data-form]') : null; if (!f) return; e.preventDefault(); const fn = forms[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('keydown', e => {
  const open = ui.sheet || ui.modal || ui.confirm;
  if (e.key === 'Escape' && open) { e.preventDefault(); if (ui.confirm || ui.modal) acts.closeModal(); else acts.closeLayer(); return; }
  if (e.key === 'Enter' && ui.sheet && !ui.modal && !ui.confirm && e.target && e.target.tagName === 'INPUT' && e.target.type !== 'file' && (ui.sheet.type === 'habit' || ui.sheet.type === 'identity')) {
    e.preventDefault(); const b = document.querySelector('#layer .sheet-foot .btn.primary'); if (b) b.click(); return;
  }
  if (e.key === 'Tab' && open) {
    const box = document.querySelector('#layer .dialog.top') || document.querySelector('#layer .sheet'); if (!box) return;
    const f = Array.prototype.filter.call(box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])'), n => n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (!box.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ---------- пример данных ---------- */
function buildDemo(now, tz, name) {
  const st = E.newState(now, tz); st.settings.name = name || ''; st.onboarded = true;
  const today = D.dayKey(now, tz), start = D.addDays(today, -41);
  let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const mk = id => { const t = C.templates[id]; return A.addIdentity(st, { tpl: id, name: t.label, statement: t.statement, desc: t.desc, color: t.color, plant: t.plant }, now).identity; };
  const sport = mk('sport'), learn = mk('learn');
  const mkH = (tplId, k, ident) => { const h = A.addHabit(st, Object.assign({}, C.templates[tplId].starters[k], { identityId: ident.id }), now).habit; h.createdDay = start; h.createdTs = Date.parse(start + 'T09:00:00Z'); if (h.design.stack) h.design.stackAt = start; return h; };
  const hs = [mkH('sport', 0, sport), mkH('sport', 1, sport), mkH('learn', 0, learn), mkH('learn', 1, learn)];
  const P = [0.92, 0.88, 0.8, 0.0, 0.6, 0.85];                 // вероятность по неделям: на четвёртой пауза
  hs.forEach((h, hi) => {
    for (let d = start; d < today; d = D.addDays(d, 1)) {
      const rel = D.diffDays(d, start), wi = Math.min(5, Math.floor(rel / 7));
      const wd = D.weekday(d);
      let due = E.isWeekly(h) ? [1, 3, 6].indexOf(wd) >= 0 : E.isDue(h, d);
      if (!due) continue;
      let p = P[wi]; if (hi === 3) p = Math.max(0, p - 0.25);   // «Слова» выполняются реже
      let level = 'planned', go1 = rnd() < p;
      if (rel === 25 || (rel === 24 && hi % 2 === 0)) { go1 = true; level = h.minimal ? 'min' : 'planned'; } // возвращение после паузы
      if (!go1) continue;
      if (level === 'planned' && h.minimal && rnd() < 0.18) level = 'min';
      st.completions.push({ id: E.uid('c'), habitId: h.id, day: d, level, amount: h.unit ? (level === 'min' ? h.unit.min : h.unit.planned) || null : null, ts: Date.parse(d + 'T12:00:00Z') });
      if (level === 'planned' && h.extra && rnd() < 0.25) st.extras.push({ habitId: h.id, day: d, ts: Date.parse(d + 'T12:30:00Z') });
    }
  });
  const cur = D.weekStart(today, st.settings.weekStart), feel = [4, 3, 4], energy = [3, 2, 4], blk = ['forgot', 'time', 'mood'], focus = ['Положить одежду для тренировки у двери', 'Учиться сразу после ужина', 'Оставить минимум на плохие дни'];
  for (let k = 1; k <= 3; k++) { const wk = D.addDays(cur, -7 * k); st.reviews[wk] = { wins: ['Вернулся после паузы с минимума', 'Получилось читать в поездке', 'Две тренировки подряд'][k - 1], blocker: blk[k - 1], hindered: '', feel: feel[k - 1], energy: energy[k - 1], focus: focus[k - 1], at: Date.parse(D.addDays(wk, 6) + 'T18:00:00Z'), day: D.addDays(wk, 6) }; }
  const tasks = [['cue', 'Положить кроссовки у двери', true], ['prep', 'Собрать сумку с вечера', true], ['obstacle', 'Убрать телефон из спальни', false]];
  tasks.forEach((t, i) => st.envTasks.push({ id: E.uid('e'), kind: t[0], habitId: i === 2 ? null : hs[i].id, text: t[1], createdAt: now - 86400000 * (10 - i), doneAt: t[2] ? now - 86400000 * (8 - i * 2) : null, doneDay: t[2] ? D.addDays(today, -(8 - i * 2)) : null, deleted: false }));
  [['Проверяю телефон сразу после пробуждения', '-'], ['Завариваю чай после обеда', '+'], ['Листаю ленту в метро', '='], ['Чищу зубы перед сном', '+']].forEach(s => st.scorecard.push({ id: E.uid('s'), text: s[0], mark: s[1] }));
  E.commit(st, now);
  return st;
}

/* ---------- запуск ---------- */
function init() {
  S = loadState();
  setTheme(S.settings.theme || 'auto');
  ui.route = parseHash();
  E.commit(S, nowTs());
  applySettings();
  lastDay = D.dayKey(nowTs(), S.settings.tz); lastHour = D.localHour(nowTs(), S.settings.tz);
  flush();
  render();
  if (!S.onboarded && !S.habits.length && !S.identities.length) { wizardInit(); openSheet({ type: 'wizard' }); }
  setInterval(() => tick(false), 30000);
  window.__rostok = { get state() { return S; }, get ctx() { return X; }, render, E };
}
init();

})();
