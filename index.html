<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Росток</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}
/* ==========================================================================
   РОСТОК — стили
   Идея: ёмкий «игровой» интерфейс на глубоком зелёном (тёмная тема) или
   тёплой светлой бумаге; акценты идентичностей яркие, всё остальное спокойное.
   Шрифты: Unbounded (цифры, заголовки, уровни) и Onest (текст, кириллица).
   ========================================================================== */
:root {
  --font-display: "Unbounded", "Onest", system-ui, sans-serif;
  --font-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  /* поверхности и текст — светлая тема «Лес» */
  --bg: #edf3ee; --surface: #ffffff; --surface-2: #e4ede6; --line: #d1dfd4;
  --fg: #11262a; --muted: #55707a; --accent: #12905f; --accent-ink: #ffffff;
  --accent-soft: color-mix(in srgb, var(--accent) 16%, var(--surface));
  --gold: #d99a0b; --sky: #3b88dc; --moss: #4fae78;
  --good: #12905f; --warn: #b9780b; --bad: #cf4a3a;
  --toast: #17302f; --toast-fg: #eaf5f0;
  --shadow: 0 1px 2px rgba(17, 38, 42, .06), 0 6px 20px rgba(17, 38, 42, .06);
  --scrim: rgba(10, 26, 28, .5);
  /* сад */
  --leaf1: #2fae72; --leaf2: #48c586; --leaf3: #1f8f5c; --stem: #3b7a52; --trunk: #8a6a47;
  --soil1: #6d4c33; --soil2: #46301f; --soil-speck: #b39266; --root: #ead7b0; --path: #dcc496;
  --ground1: #4fb37a; --ground2: #3f9a66; --hill1: #69c58f; --hill2: #8bd5a7;
  --heat1: color-mix(in srgb, var(--accent) 20%, var(--surface-2));
  --heat2: color-mix(in srgb, var(--accent) 55%, var(--surface-2));
  --heat3: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a171a; --surface: #12262a; --surface-2: #1a343a; --line: #25454c;
    --fg: #e8f3ee; --muted: #8fb0b2; --accent: #46d39a; --accent-ink: #052a1d;
    --gold: #f0be3c; --sky: #6aaef5; --moss: #6cc592;
    --good: #46d39a; --warn: #f0be3c; --bad: #ff8a78;
    --toast: #214048; --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 10px 28px rgba(0, 0, 0, .35);
    --scrim: rgba(2, 10, 12, .66);
    --leaf1: #3ecb88; --leaf2: #5fdc9f; --leaf3: #2aa66f; --stem: #4c9b6a; --trunk: #9c7b56;
    --ground1: #2f7c58; --ground2: #276a4a; --hill1: #3d8f68; --hill2: #4aa077;
    --soil1: #55392a; --soil2: #34231a; --soil-speck: #8f7352; --root: #e8d6b1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a171a; --surface: #12262a; --surface-2: #1a343a; --line: #25454c;
  --fg: #e8f3ee; --muted: #8fb0b2; --accent: #46d39a; --accent-ink: #052a1d;
  --gold: #f0be3c; --sky: #6aaef5; --moss: #6cc592;
  --good: #46d39a; --warn: #f0be3c; --bad: #ff8a78;
  --toast: #214048; --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 10px 28px rgba(0, 0, 0, .35);
  --scrim: rgba(2, 10, 12, .66);
  --leaf1: #3ecb88; --leaf2: #5fdc9f; --leaf3: #2aa66f; --stem: #4c9b6a; --trunk: #9c7b56;
  --ground1: #2f7c58; --ground2: #276a4a; --hill1: #3d8f68; --hill2: #4aa077;
  --soil1: #55392a; --soil2: #34231a; --soil-speck: #8f7352; --root: #e8d6b1;
  color-scheme: dark;
}
/* палитры, купленные за искры (после основных тем: равная специфичность, побеждает порядок) */
:root[data-pal="dawn"][data-mode="light"] { --bg: #fbeff1; --surface: #fff; --surface-2: #f5e0e4; --line: #ebccd3; --accent: #cc4268; --accent-ink: #fff; }
:root[data-pal="dawn"][data-mode="dark"] { --bg: #1a1019; --surface: #271821; --surface-2: #35202c; --line: #4d2f3f; --accent: #ff8fa8; --accent-ink: #3a0c1c; }
:root[data-pal="mist"][data-mode="light"] { --bg: #ecf1f8; --surface: #fff; --surface-2: #e0e8f3; --line: #cad8e9; --accent: #2b68c8; --accent-ink: #fff; }
:root[data-pal="mist"][data-mode="dark"] { --bg: #0b1420; --surface: #122030; --surface-2: #1b2e44; --line: #284059; --accent: #6fb0ff; --accent-ink: #07213f; }
:root[data-pal="sand"][data-mode="light"] { --bg: #f2ede0; --surface: #fffdf7; --surface-2: #eae3d0; --line: #dbd1b7; --accent: #17806f; --accent-ink: #fff; }
:root[data-pal="sand"][data-mode="dark"] { --bg: #19160f; --surface: #25211a; --surface-2: #332e22; --line: #4a4333; --accent: #e7c15a; --accent-ink: #2b2105; }
:root[data-pal="berry"][data-mode="light"] { --bg: #f2eef8; --surface: #fff; --surface-2: #e7dff2; --line: #d7cae6; --accent: #8447c4; --accent-ink: #fff; }
:root[data-pal="berry"][data-mode="dark"] { --bg: #140e1e; --surface: #1e1631; --surface-2: #2b2044; --line: #3f3060; --accent: #b98cf0; --accent-ink: #260d45; }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 0; padding-bottom: 0; min-height: 100vh; position: relative; -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
h1 { font: 700 1.55rem/1.2 var(--font-display); letter-spacing: -.01em; }
h2 { font: 600 1.02rem/1.25 var(--font-display); }
h3 { font: 600 .95rem/1.3 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
svg { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.ok-txt { color: var(--good); }
.err { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); color: var(--fg); border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); padding: 10px 12px; border-radius: 12px; font-size: .92rem; }
.ic { flex: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hc, var(--accent)); flex: none; display: inline-block; }
.dot.big { width: 16px; height: 16px; }
.tag { font-style: normal; font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: middle; }
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; } .row.between { justify-content: space-between; } .row.center { justify-content: center; } .row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.plain { display: flex; flex-direction: column; gap: 8px; padding-left: 0; }
.plain li { position: relative; padding-left: 18px; }
.plain li::before { content: ""; position: absolute; left: 3px; top: .65em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

/* ---------- каркас ---------- */
#app { max-width: 1320px; margin: 0 auto; display: block; }
#side { display: none; }
#main { min-width: 0; padding: 18px 0 calc(88px + env(safe-area-inset-bottom, 0px)); }
#main > section { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tab { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 12px; color: var(--muted); font-size: .7rem; font-weight: 600; }
.tab.on { color: var(--accent); }
.tab.on svg { stroke-width: 2.2; }
.tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: color-mix(in srgb, var(--warn) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 14px; padding: 12px 14px; margin: 0 auto 16px; max-width: 1100px; font-size: .92rem; }
@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 36px; }
  #side { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; padding: 24px 0; overflow-y: auto; }
  #tabbar { display: none; }
  #main { padding: 28px 0 56px; }
  h1 { font-size: 1.8rem; }
}
.brand { display: flex; align-items: center; gap: 10px; font: 700 1.25rem var(--font-display); color: var(--accent); padding: 0 12px; }
#side nav { display: flex; flex-direction: column; gap: 2px; }
.navlink { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; color: var(--muted); font-weight: 600; font-size: .95rem; transition: background .15s, color .15s; }
.navlink:hover { background: var(--surface-2); color: var(--fg); }
.navlink.on { background: var(--accent-soft); color: var(--accent); }
.side-level { margin-top: auto; display: flex; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.side-level b { display: block; font-size: .85rem; line-height: 1.2; }
.side-level em { font-style: normal; font-size: .78rem; color: var(--muted); }

/* ---------- базовые элементы ---------- */
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; }
.head h1 { margin-bottom: 4px; }
.head .muted { max-width: 60ch; font-size: .95rem; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sec-h { font: 600 .78rem var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 8px; }
.sub-h { font: 600 .78rem var(--font-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; }
.note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; font-size: .92rem; }
.note svg { margin-top: 2px; color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card > * + * { margin-top: 12px; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-h h2 { flex: 1; }
.card-in { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.link, .link-btn { color: var(--accent); font-weight: 600; font-size: .9rem; display: inline-flex; gap: 6px; align-items: center; }
.link:hover, .link-btn:hover { text-decoration: underline; }
.back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-weight: 600; font-size: .9rem; width: fit-content; }
.back-link:hover { color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 14px; font-weight: 700; font-size: .95rem; border: 1px solid transparent; transition: transform .12s, background .15s, filter .15s; text-align: center; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.soft:hover:not(:disabled) { filter: brightness(.97); }
.btn.ghost { border-color: var(--line); color: var(--fg); background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger-ghost { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }
.btn.wide { width: 100%; justify-content: flex-start; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .85rem; border-radius: 11px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); flex: none; font-size: 1.2rem; }
.iconbtn:hover { background: var(--surface-2); color: var(--fg); }
.iconbtn.plus { background: var(--accent); color: var(--accent-ink); }
.iconbtn.plus:hover { background: var(--accent); filter: brightness(1.08); color: var(--accent-ink); }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 13px; padding: 3px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg button { padding: 7px 13px; border-radius: 10px; font-weight: 600; font-size: .87rem; color: var(--muted); min-height: 36px; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg.wide { display: flex; width: 100%; } .seg.wide button { flex: 1; }
.seg.sm button { padding: 4px 9px; min-height: 30px; }
.seg button.mp.on { background: var(--accent); color: var(--accent-ink); }
.seg button.mn.on { background: var(--bad); color: #fff; }
.seg button.me.on { background: var(--muted); color: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 13px; border-radius: 99px; border: 1px solid var(--line); font-size: .88rem; font-weight: 600; color: var(--fg); background: var(--surface); min-height: 36px; }
.chip:hover { border-color: var(--accent); }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.switch { width: 48px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.switch.on { background: var(--accent); } .switch.on i { transform: translateX(20px); }
input[type=text], input[type=number], input[type=time], input[type=file], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 1rem; min-height: 44px; color: var(--fg); }
textarea { resize: vertical; line-height: 1.45; }
input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; padding: 0; border: 0; background: transparent; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; width: 100%; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; padding: 36px 16px; background: var(--surface); border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); }
.empty h3 { color: var(--fg); font-size: 1.05rem; } .empty p { max-width: 44ch; }
.empty svg { color: var(--accent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile b { font: 700 1.55rem/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile b.sm-num { font-size: 1rem; line-height: 1.3; }
.tile span { font-size: .82rem; color: var(--muted); }
.card .tiles .tile { background: var(--surface-2); border-color: transparent; }
.kv3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.kv3 b { display: block; font: 700 1.3rem var(--font-display); font-variant-numeric: tabular-nums; }
.kv3 span { font-size: .78rem; color: var(--muted); }
.count-pill { background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .8rem; padding: 3px 10px; border-radius: 99px; }
.spark-count { display: inline-flex; align-items: center; gap: 4px; font: 700 .9rem var(--font-display); color: var(--gold); flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: -8px; }
.legend i.sw.a { background: var(--accent); } .legend i.sw.b { background: var(--accent-soft); border: 1px solid var(--accent); }
.scroll-x { overflow-x: auto; max-width: 100%; }
.fact { font-size: 1rem; }
.inline-stat { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .92rem; }
.inline-stat b { color: var(--fg); } .units-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .92rem; color: var(--muted); }
.units-line b { color: var(--fg); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
.col-main, .col-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 980px) {
  .cols { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); }
  .cols.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
}
.group { display: flex; flex-direction: column; gap: 10px; }
.group-h { display: flex; align-items: center; gap: 10px; font: 600 .95rem var(--font-body); }

/* ---------- уровень ---------- */
.lv-badge { width: 48px; height: 48px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font: 700 1.2rem var(--font-display); color: var(--accent-ink); background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 50%, var(--sky))); flex: none; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .14); }
.lv-badge.sm { width: 36px; height: 36px; border-radius: 12px; font-size: .95rem; }
.lv-badge.xl { width: 92px; height: 92px; border-radius: 30px; font-size: 2.4rem; }
.levelstrip { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; }
.lv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.lv-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; } .lv-top b { font-size: 1rem; }
.lv-sub { font-size: .8rem; }
.lvl-big { display: flex; gap: 16px; align-items: center; } .lvl-big > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

/* ---------- главная ---------- */
.hello { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.hello > .muted { font-size: .9rem; }
.idline { display: flex; gap: 8px; align-items: flex-start; color: var(--muted); font-size: .92rem; margin-top: 4px; }
.idline svg { color: var(--accent); margin-top: 3px; } .idline b { color: var(--fg); font-weight: 600; }
.hlist { display: flex; flex-direction: column; }
.hlist.dim { opacity: .62; }
.hrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.hlist .hrow:first-child { border-top: 0; }
.hmain { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.hname { font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.hsub { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow.done .hname { color: var(--muted); }

.ledger em { font-style: normal; font-size: .8rem; color: var(--muted); } .ledger li > span:nth-child(2) b { display: block; font-weight: 600; font-size: .92rem; overflow-wrap: anywhere; } .ledger li > span:nth-child(2) i { font-style: normal; font-size: .8rem; color: var(--muted); }

  let run = 0, best = 0, miss = 0, gap = null;

    gap.to = to; gap.missed++;

  };

  if (!weekly) {

    st.todayDue = isDue(h, today) && !st.todayDone && !st.todaySkipped;
    for (let d = start; d <= today; d = addDays(d, 1)) {
      const key = h.id + '|' + d;
      const c = ix.comp.get(key);

      if (c) { run++; if (run > best) best = run; if (miss > 0) { st.comebacks++; closeGap(d, c.level); } miss = 0; }
      else if (ix.skip.has(key)) { /* отдых: нейтрально */ }

/* ---------- журнал начислений (выводится из фактов) ---------- */
function computeLedger(S, ix, today, ws) {
  const events = [];

  const sorted = S.completions.slice().sort((a, b) => a.day < b.day ? -1 : a.day > b.day ? 1 : a.ts - b.ts);

    const h = habitById.get(c.habitId); if (!h) continue;

    } else if (!isDue(h, c.day)) { ok = false; note = 'offSchedule'; }

  }

  for (const e of elig) if (e.ok) pushTo(perDay, e.c.day, e);
  for (const arr of perDay.values()) {
    arr.sort((a, b) => a.c.ts - b.c.ts);
    arr.forEach((e, i) => { if (i >= RULES.caps.habitsPerDay) { e.ok = false; e.note = 'dailyCap'; } });
  }
  for (const e of elig) {
    const base = e.c.level === 'min' ? RULES.xp.min : RULES.xp.planned;

      xp: e.ok ? base : 0, sparks: e.ok ? RULES.sparks.done : 0, note: e.note,
      title: e.h.name, sub: e.c.level === 'min' ? 'минимальная версия' : 'обычная версия'

      key: 'extra:' + x.habitId + ':' + x.day, kind: 'extra', ts: x.ts, day: x.day, habitId: h.id, identityId: h.identityId,
      xp: ok ? RULES.xp.extra : 0, sparks: ok ? RULES.sparks.extra : 0, note: ok ? null : (base.xp > 0 ? 'dailyCap' : base.note),
      title: h.name, sub: h.extra || 'дополнительный шаг'

  }
  for (const wk of Object.keys(S.reviews)) {
    const r = S.reviews[wk];
    events.push({ key: 'review:' + wk, kind: 'review', ts: r.at, day: r.day || wk, xp: RULES.xp.review, sparks: RULES.sparks.review, note: null, title: 'Обзор недели', sub: 'неделя с ' + wk });
  }
  const envWk = new Map();

    const wk = weekStart(t.doneDay, ws); const n = envWk.get(wk) || 0; const ok = n < RULES.caps.envPerWeek;
    if (ok) envWk.set(wk, n + 1);

  }

  }

    const def = A && A[id]; if (!def) continue;
    events.push({ key: 'ach:' + id, kind: 'ach', ts: S.achieved[id], day: dayKey(S.achieved[id], S.settings.tz), xp: 0, sparks: def.sparks, note: null, title: 'Достижение', sub: def.title });

function spentOf(S) {

/* ---------- главная сводка ---------- */
function derive(S, now) {
  const tz = S.settings.tz, ws = S.settings.weekStart || 1;

  const ix = buildIndex(S);

  for (const h of S.habits) hstats.set(h.id, habitStats(S, h, ix, today, ws));
  const istats = new Map();
  for (const i of S.identities) istats.set(i.id, identityStats(S, i, ix, today, ws, hstats));
  const ledger = computeLedger(S, ix, today, ws);

  return {
    now, tz, ws, today, ix, hstats, istats, ledger, level: levelInfo(ledger.xp),
    sparks: { earned: ledger.sparks, spent, balance: Math.max(0, ledger.sparks - spent) }

/* ---------- фиксация изменений ---------- */

        d_prep: ['Подготовь заранее: ' + (h.design.prepare || ''), 'Заметная подготовка превращает начало в одно движение.'],
        d_fric: ['Убери один отвлекающий предмет рядом с местом, где делаешь «' + h.name + '»', 'Чем меньше помех, тем легче начать.']
      }[p.tpl];

  const t = Object.assign({ id: 't' + Math.random().toString(36).slice(2, 7), ttl: 5200 }, o);
  toasts.push(t); if (toasts.length > 4) toasts.shift();
  drawToasts();
  if (t.ttl) setTimeout(() => dismissToast(t.id), t.ttl);
  return t.id;
}
function dismissToast(id) { const i = toasts.findIndex(t => t.id === id); if (i >= 0) { toasts.splice(i, 1); drawToasts(); } }
function drawToasts() {
  const el = $('#toasts'); if (!el) return;
  el.innerHTML = toasts.map(t => '<div class="toast ' + (t.kind || '') + '" role="status">'
    + (t.badge ? '<span class="toast-badge">' + t.badge + '</span>' : t.icon ? '<span class="toast-ic">' + ico(t.icon, 18) + '</span>' : '')
    + '<div class="toast-body"><b>' + t.text + '</b>' + (t.sub ? '<span>' + t.sub + '</span>' : '') + '</div>'
    + (t.action ? '<button class="toast-act" data-act="' + t.action.act + '" data-args="' + esc(JSON.stringify(t.action.args || {})) + '" data-toast="' + t.id + '">' + t.action.label + '</button>' : '')
    + '<button class="toast-x" data-act="toastClose" data-toast="' + t.id + '" aria-label="Закрыть">' + ico('close', 16) + '</button></div>').join('');
}
function floatChip(el, text) {
  if (!el || S.settings.motion === 'off') return;
  try {
    const r = el.getBoundingClientRect(), c = document.createElement('div');
    c.className = 'float-chip'; c.textContent = text;
    c.style.left = (r.left + r.width / 2) + 'px'; c.style.top = (r.top + window.scrollY) + 'px';
    document.body.appendChild(c); setTimeout(() => c.remove(), 1300);
  } catch (e) { /* без анимации */ }
}

/* ---------- обратная связь после действий ---------- */
function stagesMap(ctx) {
  const m = {};
  for (const i of S.identities) { const st = ctx.istats.get(i.id); if (st) m[i.id] = R.growthStage(st.conf, st.activeWeeks); }
  return m;
}
const ERR = { future: 'Будущие дни отмечать нельзя.', tooOld: 'Отметки старше ' + E.RULES.editWindowDays + ' дней не меняются.', notFound: 'Привычка не найдена.', needBase: 'Сначала отметь привычку.', alreadyDone: 'День уже отмечен как выполненный.', noExtra: 'У привычки нет дополнительного шага.' };
const NOTE_TXT = { offSchedule: 'вне расписания: записано без XP', overPlan: 'сверх недельного плана: записано без XP', dailyCap: 'дневной лимит XP: записано без XP', weekCap: 'недельный лимит наград за среду' };

function feedbackDone(rep, h, day, before, el, opts) {
  opts = opts || {};
  const game = isGame(), e = rep.event;
  const undo = { label: 'Отменить', act: 'undoDone', args: { id: h.id, day } };
  if (game && e && !rep.created) {
    toast({ icon: 'check', text: 'Отметка обновлена · ' + esc(h.name), sub: 'Опыт за этот день пересчитан: ' + e.xp + ' XP', action: undo, ttl: 3800 });
  } else if (game && e) {
    const txt = e.xp > 0 ? '+' + e.xp + ' XP' : 'Записано';
    toast({ icon: 'check', text: txt + ' · ' + esc(h.name), sub: e.xp > 0 ? (e.level === 'min' ? 'Минимум тоже считается: ты остаёшься в пути' : 'Подтверждение для идентичности') + (e.sparks ? ' · +' + e.sparks + ' ✦' : '') : esc(NOTE_TXT[e.note] || ''), kind: e.xp > 0 ? 'good' : '', action: undo });
    if (e.xp > 0) floatChip(el, '+' + e.xp + ' XP');
  } else if (!game) toast({ icon: 'check', text: 'Отмечено · ' + esc(h.name), action: undo, ttl: 3500 });
  if (!game) return;
  rep.newAch.forEach(id => { const d = R.achievementIndex[id]; toast({ badge: Art.badge(d, true, 40), text: 'Достижение: ' + esc(d.title), sub: esc(d.desc) + ' · +' + d.sparks + ' ✦', kind: 'ach', ttl: 7000, action: { label: 'Смотреть', act: 'go', args: { to: 'awards' } } }); });
  rep.questsDone.forEach(q => toast({ icon: 'flag', text: 'Квест выполнен', sub: esc(q.title) + ' · +' + (E.RULES.sparks.quest[q.kind] || 0) + ' ✦', ttl: 4200 }));
  if (h.identityId && before) {
    const nowSt = stagesMap(rep.ctx)[h.identityId], was = before[h.identityId], i = identityById(h.identityId);
    if (nowSt > was && i) toast({ icon: 'sprout', text: '«' + esc(i.name) + '» вырос', sub: 'Теперь: ' + C.stageNames[nowSt].toLowerCase(), kind: 'good', ttl: 4200 });
  }
  if (rep.levelUp) ui.modal = { type: 'level', from: rep.levelUp.from, to: rep.levelUp.to };
}

function doComplete(id, level, day, el) {
  const h = habitById(id); if (!h) return;
  day = day || X.today;
  const before = stagesMap(X);
  const wasSame = X.ix.comp.get(id + '|' + day) && X.ix.comp.get(id + '|' + day).level === (level === 'min' ? 'min' : 'planned');
  if (wasSame) return;
  const rep = A.complete(S, id, day, level, nowTs());
  if (!rep.ok) { toast({ icon: 'info', text: ERR[rep.error] || 'Не удалось отметить' }); return; }
  save();
  if (day === X.today) { ui.justDone = id + '|' + day; setTimeout(() => { ui.justDone = null; }, 1000); }
  feedbackDone(rep, h, day, before, el);
  render();
}
function doUncomplete(id, day) {
  const rep = A.uncomplete(S, id, day || X.today, nowTs());
  if (!rep.ok) { toast({ icon: 'info', text: ERR[rep.error] || 'Не удалось снять отметку' }); return; }
  save(); toast({ icon: 'undo', text: 'Отметка снята', sub: isGame() ? 'Показатели пересчитаны' : '', ttl: 2800 }); render();
}

/* ---------- слой диалогов ---------- */
function openSheet(s) { ui.sheet = s; renderLayer(); }
function closeSheet() { ui.sheet = null; ui.draft = null; renderLayer(); }
function confirmDlg(o) { ui.confirm = o; renderLayer(); }
function keepFocus(fn) {
  const a = document.activeElement, id = a && a.id, s = a && a.selectionStart, e = a && a.selectionEnd, sc = $('#layer .sheet-body') ? $('#layer .sheet-body').scrollTop : 0;
  fn();
  if (id) { const n = document.getElementById(id); if (n) { n.focus(); try { if (s != null) n.setSelectionRange(s, e); } catch (x) { /* не текстовое поле */ } } }

/* ---------- регулярный тик: смена дня, времени суток ---------- */
let lastDay = null, lastHour = null, notified = {};
function tick(force) {
  if (!S) return;
  const n = nowTs(), day = D.dayKey(n, S.settings.tz), hr = D.localHour(n, S.settings.tz);
  if (force || day !== lastDay || hr !== lastHour) {
    const dayChanged = day !== lastDay;
    lastDay = day; lastHour = hr;
    if (dayChanged) { const rep = E.commit(S, n); save(); void rep; }
    if (!ui.sheet && !ui.modal) render();
  }
  if (S.settings.notify) reminders(n, day);
}
function reminders(n, day) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  const parts = new Intl.DateTimeFormat('en-GB', { timeZone: S.settings.tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(n));
  for (const h of habitsLive()) {
    const t = h.design && h.design.time; if (!t) continue;
    const st = X.hstats.get(h.id); if (!st || !st.todayDue) continue;
    const key = day + h.id; if (notified[key] || parts < t) continue;
    notified[key] = 1;
    try { new Notification('Пора: ' + h.name, { body: h.minimal ? 'Можно начать с малого: ' + h.minimal : 'Одно маленькое действие тоже считается.' }); } catch (e) { /* уведомления недоступны */ }
  }
}

/* ---------- файлы ---------- */
async function saveFile(name, text, mime) {
  try {
    if (window.claude && window.claude.use) {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data: text }); toast({ icon: 'download', text: 'Файл готов', sub: esc(name) }); return; }
      ui.modal = { type: 'copy', title: name, text }; renderLayer(); return;
    }
    const blob = new Blob([text], { type: mime || 'text/plain' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast({ icon: 'download', text: 'Файл сохранён', sub: esc(name) });
  } catch (e) {
    if (e && e.code === 'declined') return;
    ui.modal = { type: 'copy', title: name, text }; renderLayer();
  }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast({ icon: 'check', text: 'Скопировано', ttl: 2000 }); return true; }
  catch (e) { return false; }
}

}
function todayGroups() {
  const open = [], done = [], rest = [];
  for (const h of habitsLive()) {
    const st = X.hstats.get(h.id);
    if (st.todayDone) done.push(h);
    else if (st.todaySkipped) rest.push(h);
    else if (st.todayDue) open.push(h);
    else if (E.isWeekly(h)) rest.push(h);
  }
  const byTime = (a, b) => ((a.design.time || '99:99') < (b.design.time || '99:99') ? -1 : 1);
  open.sort(byTime); done.sort(byTime);
  return { open, done, rest };

/* ---------- карточка привычки ---------- */
function calendarGrid(h, st) {
  const weeks = 6, endW = D.weekStart(X.today, X.ws), startW = D.addDays(endW, -7 * (weeks - 1));
  let head = '<div class="cal-h">' + [0, 1, 2, 3, 4, 5, 6].map(k => '<span>' + C.weekdaysShort[(k + X.ws - 1) % 7] + '</span>').join('') + '</div>', rows = '';
  for (let w = 0; w < weeks; w++) {
    let row = '<div class="cal-row"><em>' + fmtDay(D.addDays(startW, w * 7)) + '</em>';
    for (let k = 0; k < 7; k++) {
      const d = D.addDays(startW, w * 7 + k), key = h.id + '|' + d, c = X.ix.comp.get(key);
      const fut = d > X.today, before = d < h.createdDay && !c, due = E.isDue(h, d), sk = X.ix.skip.has(key) || (E.isWeekly(h) && X.ix.skip.has(h.id + '|' + D.weekStart(d, X.ws)));
      let cls = 'off', icon = '', tip = fmtDay(d);
      if (c) { cls = c.level === 'min' ? 'min' : 'ok'; tip += c.level === 'min' ? ': минимум' : ': выполнено'; icon = c.level === 'min' ? '' : ico('check', 12); }
      else if (fut || before) cls = 'fut';
      else if (sk) { cls = 'rest'; tip += ': отдых'; icon = ico('moon', 11); }
      else if (!E.isWeekly(h) && due && d < X.today) { cls = 'gap'; tip += ': пропуск, можно вернуться'; }
      const edit = !fut && D.diffDays(X.today, d) <= E.RULES.editWindowDays && !before;
      row += (edit ? '<button class="cal ' + cls + (d === X.today ? ' today' : '') + '" data-act="daySheet" data-id="' + h.id + '" data-day="' + d + '" title="' + tip + '" aria-label="' + tip + '">' + icon + '</button>' : '<span class="cal ' + cls + (d === X.today ? ' today' : '') + '" title="' + tip + '">' + icon + '</span>');
    }
    rows += row + '</div>';
  }
  return head + rows + '<p class="legend"><i class="cal ok"></i>выполнено<i class="cal min"></i>минимум<i class="cal rest"></i>отдых<i class="cal gap"></i>можно вернуться</p>';
}
function lawsSummary(h) {
  const d = h.design || {}, av = h.kind === 'avoid';
  const rows = [
    [1, av ? [d.hide && ('Убираю: ' + d.hide), cueText(h)] : [cueText(h), d.prepare && ('Подготовка: ' + d.prepare)]],
    [2, av ? [d.bundle && ('Выгода отказа: ' + d.bundle), d.why] : [d.bundle && ('Совмещаю с: ' + d.bundle), d.why && ('Зачем: ' + d.why)]],
    [3, av ? [d.friction && ('Добавляю трение: ' + d.friction), h.minimal && ('Хотя бы: ' + h.minimal)] : [h.minimal && ('Минимум: ' + h.minimal), h.extra && ('Дополнительно: ' + h.extra)]],
    [4, [d.reward && ((av ? 'Контракт: ' : 'Награда: ') + d.reward), d.recovery && ('Если пропущу: ' + d.recovery)]]

  return '<ul class="laws">' + rows.map(r => { const vals = r[1].filter(Boolean); return '<li class="' + (vals.length ? 'on' : '') + '"><span class="ln">' + r[0] + '</span><span><b>' + (av ? C.laws[r[0] - 1].avoid : C.laws[r[0] - 1].build) + '</b>' + (vals.length ? vals.map(v => '<em>' + esc(v) + '</em>').join('') : '<em class="muted">Пока не заполнено</em>') + '</span></li>'; }).join('') + '</ul>';
}
function suggestionCard(h) {

/* ---------- путь: идентичности ---------- */
function factSentence(st) {
  if (!st.conf) return 'Подтверждающих действий пока нет. Первое выполнение запустит рост.';
  if (!st.conf30) return 'За последние 30 дней действий не было. Всё накопленное сохранено, можно вернуться с минимума.';
  let s = 'За последние 30 дней: ' + st.conf30 + ' ' + plural(st.conf30, ['выполнение', 'выполнения', 'выполнений']);
  if (st.min30) s += ', ' + st.min30 + ' ' + plural(st.min30, ['раз', 'раза', 'раз']) + ' выбрана короткая версия';
  if (st.minutes30) s += ', в сумме ' + st.minutes30 + ' мин';
  return s + '.';
}
function weekSquares(identityId) {
  const cur = D.weekStart(X.today, X.ws); let s = '';
  const habitIds = new Set(S.habits.filter(h => !identityId || h.identityId === identityId).map(h => h.id));
  for (let k = 7; k >= 0; k--) {
    const wk = D.addDays(cur, -7 * k), we = D.addDays(wk, 6); let n = 0;
    for (const c of S.completions) if (habitIds.has(c.habitId) && c.day >= wk && c.day <= we) n++;
    s += '<i class="wsq l' + (n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : 3) + '" title="' + fmtRange(wk, we) + ': ' + n + '"></i>';
  }
  return '<span class="wsqs" aria-label="Активность по неделям">' + s + '</span>';
}
function identityCard(i) {
  const st = X.istats.get(i.id), stage = i.stage, info = R.stageInfo(i, Math.min(stage, 4));
  const crit = stage <= 4 ? R.stageCriteria(S, X, i, stage) : null;
  const next = crit ? (crit.met ? 'Критерии этапа выполнены' : (function () { const u = crit.items.find(c => !c.met); return u ? u.label + ': ' + (u.unknown ? 'пока мало данных' : u.cur + ' из ' + u.target) : ''; })()) : 'Все этапы пройдены';
  return '<li><a class="icard" href="#identity-' + i.id + '" data-go="identity-' + i.id + '" style="--hc:' + hexOf(i.color) + '">'
    + (isGame() ? '<span class="ic-plant">' + miniPlant(i, 56) + '</span>' : '<span class="dot big"></span>')
    + '<span class="ic-main"><b>' + esc(i.statement || i.name) + '</b>'
    + '<span class="stage-chip">' + (stage <= 4 ? 'Этап ' + (stage + 1) + ' из 5 · ' + esc(info.title) : 'Все этапы пройдены') + '</span>'
    + '<span class="muted small">' + factSentence(st) + '</span>'
    + '<span class="ic-next ' + (crit && crit.met ? 'ready' : '') + '">' + (crit && crit.met ? ico('check', 14) : ico('target', 14)) + esc(next) + '</span></span>' + ico('right', 18) + '</a></li>';
}
function screenPath() {
  const act = S.identities.filter(i => !i.archived), arch = S.identities.filter(i => i.archived);
  let body = '';
  if (!act.length) body = empty('route', 'Выбери, кем хочешь стать', 'Идентичность — это образ, который ты подтверждаешь маленькими действиями: «Я человек, который занимается спортом».', '<button class="btn primary" data-act="newIdentity">Добавить идентичность</button>');
  else body = '<ul class="icards">' + act.map(identityCard).join('') + '</ul>';
  if (arch.length) body += '<section class="group"><button class="link-btn" data-act="toggleArch">' + ico(ui.showArchived ? 'down' : 'right', 16) + ' Архив идентичностей (' + arch.length + ')</button>' + (ui.showArchived ? '<ul class="icards">' + arch.map(identityCard).join('') + '</ul>' : '') + '</section>';
  return '<section>' + head('Мой путь', 'Идентичности, привычки и подтверждающие действия', '<button class="btn primary" data-act="newIdentity">' + ico('plus', 18) + 'Идентичность</button>')
    + '<p class="note">' + ico('info', 16) + '<span>Здесь только факты о твоих действиях. Процента «насколько ты спортсмен» нет: игровые показатели не оценивают человека.</span></p>' + body + '</section>';
}
function stageTrack(i) {
  let s = '<ol class="stages">';
  for (let k = 0; k < 5; k++) {
    const info = R.stageInfo(i, k), hist = i.stageHistory.filter(x => x.stage === k && !x.manual).pop();
    const state = i.stage > k ? 'done' : i.stage === k ? 'cur' : 'next';
    let crit = '';
    if (state === 'cur') {
      const c = R.stageCriteria(S, X, i, k);
      crit = '<ul class="crit">' + c.items.map(it => '<li class="' + (it.met ? 'met' : '') + '"><span>' + it.label + '</span><b>' + (it.unknown ? 'мало данных' : it.cur + ' / ' + it.target) + '</b>' + bar(it.unknown ? 0 : Math.min(1, it.cur / it.target)) + '</li>').join('') + '</ul>'
        + '<div class="row wrap"><button class="btn primary" data-act="completeStage" data-id="' + i.id + '"' + (c.met ? '' : ' disabled') + '>' + (c.met ? 'Завершить этап' : 'Критерии ещё не выполнены') + '</button></div>';
    }
    s += '<li class="stage ' + state + '"><span class="sdot">' + (state === 'done' ? ico('check', 14) : k + 1) + '</span><div><b>' + esc(info.title) + '</b><p class="muted small">' + esc(info.desc) + '</p>'
      + (info.goal ? '<p class="goal">' + ico('target', 14) + esc(info.goal) + '</p>' : '') + (hist ? '<p class="small ok-txt">Пройден ' + fmtDay(D.dayKey(hist.at, S.settings.tz)) + '</p>' : '') + crit + '</div></li>';
  }
  return s + '</ol>' + (i.stage > 4 ? '<p class="note">' + ico('check', 16) + '<span>Все пять этапов пройдены. Ветка продолжает расти: можно вернуться к любому этапу или записать новую цель.</span></p>' : '');
}

    + '<div class="cols two"><div class="col-main"><section class="card"><div class="card-h"><h2>Этапы</h2></div>' + stageTrack(i) + '</section>'

}

  }).join('');
  return '<section class="garden-page">' + head('Сад', 'Мир накопленного прогресса', seg('gardenView', ui.rootsView ? 'roots' : 'above', [['above', 'Над землёй'], ['roots', 'Корни']]))
    + '<div class="card garden-card">' + gardenSVG({ roots: ui.rootsView }) + '</div>'

/* ---------- квесты ---------- */
const QKIND = { daily: 'Квест дня', weekly: 'Недельный квест', identity: 'Квест идентичности', recovery: 'Квест возвращения' };
function questHelper(q) {
  const h = q.habitId ? habitById(q.habitId) : null;
  switch (q.tpl) {
    case 'd_min': case 'rq': return h && !X.ix.comp.has(h.id + '|' + X.today) ? '<button class="btn primary" data-act="minCheck" data-id="' + h.id + '">' + (h.minimal ? 'Сделать минимум' : 'Отметить') + '</button>' : '';
    case 'd_stack': case 'w_stack': return h ? '<button class="btn soft" data-act="editHabit" data-id="' + h.id + '" data-focus="stack">Заполнить сигнал</button>' : '<button class="btn soft" data-go="habits">К привычкам</button>';
    case 'w_obstacle': case 'w_prep': return '<button class="btn soft" data-go="env">Открыть «Среду»</button>';
    case 'w_review': return '<button class="btn soft" data-go="review">Начать обзор</button>';
    case 'w_sched': return h ? '<button class="btn soft" data-go="habit-' + h.id + '">К привычке</button>' : '';
    default: return '';
  }
}
function questBody(q, compact) {
  const p = R.questProgress(S, X, q), done = q.status === 'done', reward = E.RULES.sparks.quest[q.kind] || 0;
  const manual = !q.auto;
  return '<div class="quest' + (done ? ' done' : '') + '"><div class="q-top"><span class="q-kind">' + ico('flag', 14) + QKIND[q.kind] + '</span><span class="q-reward">' + (done ? ico('check', 14) + ' выполнено' : '+' + reward + ' ✦') + '</span></div>'
    + '<h3>' + esc(q.title) + '</h3><p class="muted small">' + esc(q.why || '') + '</p>'
    + (q.target > 1 ? '<div class="q-prog">' + bar(p.cur / p.target) + '<span>' + p.cur + ' из ' + p.target + '</span></div>' : '')
    + '<div class="row wrap">' + (done ? '' : questHelper(q))
    + (manual ? '<button class="btn ' + (done ? 'ghost' : 'primary') + '" data-act="questToggle" data-id="' + q.id + '">' + (done ? 'Снять отметку' : 'Готово') + '</button>' : '')
    + (!done && !compact ? '<button class="btn ghost" data-act="questDismiss" data-id="' + q.id + '">Не сейчас</button>' : '')
    + (!done && compact ? '<button class="btn ghost sm" data-act="questDismiss" data-id="' + q.id + '">Не сейчас</button>' : '') + '</div></div>';
}
function screenQuests() {
  const mode = S.settings.quests;
  const wk = D.weekStart(X.today, X.ws);
  const act = S.quests.filter(q => q.status === 'active' && ((q.kind === 'daily' && q.period === X.today) || (q.kind === 'weekly' && q.period === wk) || q.kind === 'identity' || q.kind === 'recovery'));

  }

/* ---------- аналитика ---------- */
function rangeOf() {
  const t = X.today, r = ui.statsRange;
  if (r === 'week') return { from: D.addDays(t, -6), to: t, label: '7 дней', unit: 'day' };
  if (r === 'month') return { from: D.addDays(t, -29), to: t, label: '30 дней', unit: 'day' };
  if (r === 'quarter') return { from: D.addDays(t, -89), to: t, label: '90 дней', unit: 'week' };
  let first = t; for (const c of S.completions) if (c.day < first) first = c.day;
  return { from: D.maxKey(first, D.addDays(t, -364)), to: t, label: 'всё время', unit: 'week' };
}

  const subj = '<h2 class="sec-h">Твои оценки</h2>' + (revs.length >= 2 ? '<div class="card"><p class="muted small">Из еженедельных обзоров. Шкала 1–5, твоё субъективное ощущение.</p>' + Art.line({ data: revs.map(x => ({ label: fmtDay(x.k).replace(/ .*/, ''), v: x.r.feel, tip: fmtRange(x.k, D.addDays(x.k, 6)) + ': ощущение прогресса ' + x.r.feel })), w: cw, h: Math.round(ch * .8), max: 5, fmt: v => Math.round(v), color: 'var(--sky)', label: 'Ощущение прогресса по неделям' }) + '</div>' : '<div class="card"><p class="muted">Пока меньше двух обзоров. Оценку ощущения прогресса можно ставить в конце недели: график появится после второго обзора.</p><button class="btn soft" data-go="review">Провести обзор недели</button></div>');
  return '<section>' + head0 + '<h2 class="sec-h">Реальные действия</h2>' + tiles

    + '<div class="card"><div class="card-h"><h2>Доля запланированного</h2><span class="muted small">по неделям</span></div>' + (hasLine ? Art.line({ data: lineData, w: cw, h: Math.round(ch * .9), max: 1, fmt: v => Math.round(v * 100) + '%', skipLabels: 2, label: 'Доля выполненного по неделям' }) : '<p class="muted">Нужно хотя бы две недели с достаточным числом плановых дней. Пока рисовать нечего.</p>') + '</div>'

    + (idCards ? '<div class="card"><div class="card-h"><h2>По идентичностям</h2></div><ul class="idstats">' + idCards + '</ul></div>' : '') + game + subj + '</section>';
}

/* ---------- обзор недели ---------- */
function defaultReviewWeek() {
  const cur = D.weekStart(X.today, X.ws), prev = D.addDays(cur, -7);
  if (!S.reviews[prev] && D.diffDays(X.today, cur) <= 2 && S.completions.some(c => c.day >= prev && c.day < cur)) return prev;
  return cur;
}
function reviewInit(wk) {
  const ex = S.reviews[wk] || {};
  ui.review = { wk, step: 0, wins: ex.wins || '', blocker: ex.blocker || '', hindered: ex.hindered || '', feel: ex.feel || 3, energy: ex.energy || 3, focus: ex.focus || '', existing: !!S.reviews[wk] };
}
function screenReview() {
  if (!ui.review || ui.review.wk > X.today) reviewInit(defaultReviewWeek());
  const rv = ui.review, wk = rv.wk, we = D.addDays(wk, 6), facts = R.reviewFacts(S, X, wk);
  const cur = D.weekStart(X.today, X.ws), isCur = wk === cur;
  const steps = ['Факты', 'Размышление', 'Корректировка', 'Фокус'];
  const dots = '<ol class="steps">' + steps.map((s, k) => '<li class="' + (k === rv.step ? 'cur' : k < rv.step ? 'done' : '') + '"><button data-act="revStep" data-val="' + k + '"><span>' + (k + 1) + '</span>' + s + '</button></li>').join('') + '</ol>';
  let body = '';
  if (rv.step === 0) {
    body = facts.rows.length ? '<div class="card"><h2>Что было на этой неделе</h2><ul class="rev-rows">' + facts.rows.map(r => '<li style="--hc:' + habitColor(r.habit) + '"><span class="dot"></span><span><b>' + esc(r.habit.name) + '</b><em>' + (r.plan ? r.done + ' из ' + r.plan + ' по плану' : 'без плановых дней') + (r.min ? ' · минимум ' + r.min : '') + (r.total > r.done ? ' · вне плана ' + (r.total - r.done) : '') + (r.returned ? ' · вернулся(лась) после пропуска' : '') + '</em></span>' + (r.pct != null ? bar(r.pct) : '') + '</li>').join('') + '</ul>'
      + '<div class="kv3"><div><b>' + facts.totals.total + '</b><span>выполнений</span></div><div><b>' + (facts.totals.plan ? pctTxt(facts.totals.done / facts.totals.plan) : '—') + '</b><span>плана</span></div><div><b>' + facts.totals.min + '</b><span>коротких версий</span></div></div></div>' : empty('list', 'На этой неделе нет привычек', 'Создай привычку, и обзор покажет факты.', '<button class="btn primary" data-act="newHabit">Создать привычку</button>');
  } else if (rv.step === 1) {
    body = '<div class="card"><h2>Что сработало?</h2><label class="sr" for="rev-wins">Что сработало</label><textarea id="rev-wins" rows="3" data-rev="wins" placeholder="Что помогло начать? Что было приятно?">' + esc(rv.wins) + '</textarea>'
      + '<h2>Что мешало?</h2><div class="chips">' + Object.keys(C.blockers).map(k => '<button class="chip' + (rv.blocker === k ? ' on' : '') + '" data-act="revBlocker" data-val="' + k + '">' + C.blockers[k] + '</button>').join('') + '</div>'
      + '<label class="sr" for="rev-hind">Подробнее о помехе</label><textarea id="rev-hind" rows="2" data-rev="hindered" placeholder="Подробнее, если хочется. Помеха — это свойство плана, а не недостаток характера.">' + esc(rv.hindered) + '</textarea></div>'
      + '<div class="card"><h2>Как ощущается прогресс?</h2><div class="slider"><input type="range" id="rev-feel" min="1" max="5" step="1" value="' + rv.feel + '" data-rev="feel" aria-label="Ощущение прогресса"><output id="out-feel">' + rv.feel + ' из 5</output></div>'
      + '<h2>Сколько было энергии?</h2><div class="slider"><input type="range" id="rev-energy" min="1" max="5" step="1" value="' + rv.energy + '" data-rev="energy" aria-label="Энергия"><output id="out-energy">' + rv.energy + ' из 5</output></div><p class="muted small">Это твои личные оценки. Они не влияют на XP и показываются на графике отдельно.</p></div>';
  } else if (rv.step === 2) {
    const flagged = facts.rows.filter(r => r.sug);
    body = flagged.length ? flagged.map(r => '<div class="card sugg ' + r.sug.mode + '"><h2>' + esc(r.habit.name) + '</h2><p class="muted">' + r.sug.title + '. ' + r.sug.lead + '</p><div class="sugg-opts">' + r.sug.options.map(o => o.route ? '<a class="sopt" href="#' + o.route + '" data-go="' + o.route + '"><b>' + o.title + '</b><span>' + o.why + '</span></a>' : o.focus ? '<button class="sopt" data-act="suggest" data-id="' + r.habit.id + '" data-focus="' + o.focus + '" data-simplify="' + (o.simplify ? 1 : 0) + '"><b>' + o.title + '</b><span>' + o.why + '</span></button>' : '<div class="sopt static"><b>' + o.title + '</b><span>' + o.why + '</span></div>').join('') + '</div></div>').join('')
      : '<div class="card"><h2>Менять ничего не нужно</h2><p class="muted">Ни одна привычка не выглядит перегруженной или слишком лёгкой. Если хочется, можно подправить что-то вручную в карточке привычки или на экране «Среда».</p><div class="row wrap"><button class="btn soft" data-go="habits">К привычкам</button><button class="btn soft" data-go="env">К среде</button></div></div>';
    const ch = []; S.habits.forEach(h => h.changes.forEach(c => { if (c.day >= wk && c.day <= we) ch.push(h.name + ': ' + (c.text || 'изменено')); }));
    if (ch.length) body += '<div class="card"><h2>Изменения этой недели</h2><ul class="plain">' + ch.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>';
  } else {
    body = '<div class="card"><h2>Один фокус на следующую неделю</h2><p class="muted">Одно небольшое намерение: что сделать проще, раньше или иначе.</p><label class="sr" for="rev-focus">Фокус</label><textarea id="rev-focus" rows="3" data-rev="focus" placeholder="Например: положить кроссовки у двери вечером">' + esc(rv.focus) + '</textarea>'
      + '<p class="muted small">' + (rv.existing ? 'Обзор за эту неделю уже сохранён. Повторное сохранение обновит ответы, награда не повторяется.' : (isGame() ? 'За завершённый обзор: +' + E.RULES.xp.review + ' XP и +' + E.RULES.sparks.review + ' ✦ один раз за неделю.' : 'Обзор сохранится в истории.')) + '</p>'
      + '<button class="btn primary" data-act="saveReview">' + (rv.existing ? 'Обновить обзор' : 'Завершить обзор') + '</button></div>';
  }
  const past = Object.keys(S.reviews).sort().reverse().slice(0, 6);
  return '<section>' + head('Обзор недели', fmtRange(wk, we) + (isCur ? ' · эта неделя' : ' · прошлая неделя'), '<div class="seg"><button class="' + (!isCur ? 'on' : '') + '" data-act="revWeek" data-val="' + D.addDays(cur, -7) + '">Прошлая</button><button class="' + (isCur ? 'on' : '') + '" data-act="revWeek" data-val="' + cur + '">Эта</button></div>')
    + dots + body
    + '<div class="row between rev-nav"><button class="btn ghost" data-act="revStep" data-val="' + Math.max(0, rv.step - 1) + '"' + (rv.step === 0 ? ' disabled' : '') + '>' + ico('left', 16) + 'Назад</button>' + (rv.step < 3 ? '<button class="btn primary" data-act="revStep" data-val="' + (rv.step + 1) + '">Дальше' + ico('right', 16) + '</button>' : '') + '</div>'
    + (past.length ? '<h2 class="sec-h">Прошлые обзоры</h2><ul class="past-rev">' + past.map(k => { const r = S.reviews[k]; return '<li><b>' + fmtRange(k, D.addDays(k, 6)) + '</b><span>' + (r.focus ? 'Фокус: ' + esc(r.focus) : r.wins ? esc(r.wins) : 'без заметок') + '</span><i>ощущение ' + (r.feel || '—') + ' · энергия ' + (r.energy || '—') + '</i></li>'; }).join('') + '</ul>' : '') + '</section>';
}

    Object.keys(part).forEach(k => { if (!part[k].length) return; body += '<h2 class="sec-h">' + k + '</h2><ul class="cue-list">' + part[k].map(h => '<li style="--hc:' + habitColor(h) + '"><span class="dot"></span><span class="cl-main"><b>' + esc(h.name) + '</b><em>' + (E.hasCue(h) ? esc(cueText(h) || '') : 'Сигнал не задан') + '</em>' + (h.design.prepare ? '<span class="small muted">Подготовка: ' + esc(h.design.prepare) + '</span>' : '') + '</span><button class="btn ' + (E.hasCue(h) ? 'ghost' : 'soft') + ' sm" data-act="editHabit" data-id="' + h.id + '" data-focus="' + (E.hasCue(h) ? 'time' : 'stack') + '">' + (E.hasCue(h) ? 'Изменить' : 'Задать сигнал') + '</button></li>').join('') + '</ul>'; });

      + '<div class="card"><form data-form="env" class="env-form"><div class="seg" id="env-kinds">' + Object.keys(C.envKinds).map(k => '<button type="button" class="' + (ui.envKind === k || (!ui.envKind && k === 'cue') ? 'on' : '') + '" data-act="envKind" data-val="' + k + '">' + C.envKinds[k].title + '</button>').join('') + '</div>'

      + '<div class="chips">' + C.envKinds[ui.envKind || 'cue'].chips.map(c => '<button type="button" class="chip" data-act="envChip" data-val="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>'
      + '<label class="sr" for="env-habit">Привычка</label><select id="env-habit"><option value="">Для всех привычек</option>' + habitsLive().map(h => '<option value="' + h.id + '">' + esc(h.name) + '</option>').join('') + '</select><button class="btn primary" type="submit">Добавить задачу</button></form></div>';

/* ---------- профиль ---------- */
function palSwatch(id) {

  return '<span class="swatch">' + sw.map(c => '<i style="background:' + c + '"></i>').join('') + '</span>';
}
function shopRow(it) {
  const owned = S.owned.indexOf(it.id) >= 0, key = it.id.split(':')[1];
  let act;
  if (it.type === 'decor') {
    const shown = S.settings.decorOff.indexOf(key) < 0;
    act = owned ? '<button class="btn soft sm" data-act="decorToggle" data-val="' + key + '">' + (shown ? 'Убрать из сада' : 'Показать') + '</button>' : '<button class="btn primary sm" data-act="buy" data-id="' + it.id + '"' + (X.sparks.balance < it.price ? ' disabled' : '') + '>' + it.price + ' ✦</button>';
  } else {

  }
  const prev = it.type === 'pal' ? palSwatch(key) : it.type === 'emblem' ? Art.emblem(key, S.settings.frame, 44) : it.type === 'frame' ? Art.emblem(S.settings.emblem, key, 44) : '<span class="shop-ic">' + ico('sprout', 22) + '</span>';
  return '<li>' + prev + '<span><b>' + it.title + '</b><em>' + (it.desc || '') + '</em></span>' + act + '</li>';
}
function screenProfile() {

function focusSig() {

}
function restoreFocus(sig) {
  if (!sig || (document.activeElement && document.activeElement !== document.body)) return;
  const sel = sig.act ? '[data-act="' + sig.act + '"]' + (sig.id ? '[data-id="' + sig.id + '"]' : '') + (sig.val != null ? '[data-val="' + sig.val + '"]' : '') + (sig.day ? '[data-day="' + sig.day + '"]' : '') : '[data-go="' + sig.go + '"]';

}
const FORM_SHEETS = ['habit', 'identity', 'wizard', 'import'];

/* ---------- лист дня ---------- */
function daySheet(s) {
  const h = habitById(s.id); if (!h) return '';
  const day = s.day, isToday = day === X.today, key = h.id + '|' + day;
  const c = X.ix.comp.get(key), weekly = E.isWeekly(h);
  const skipped = X.ix.skip.has(weekly ? h.id + '|' + D.weekStart(day, X.ws) : key);
  const exDone = X.ix.extra.has(key);
  let status = 'Не отмечено';
  if (c) status = c.level === 'min' ? 'Выполнено: минимальная версия' : 'Выполнено: обычная версия';
  else if (skipped) status = weekly ? 'Отдых на эту неделю' : 'Отдых без штрафа';
  const btn = (act, label, cls, extra) => '<button class="btn ' + cls + ' wide" data-act="' + act + '" data-id="' + h.id + '" data-day="' + day + '"' + (extra || '') + '>' + label + '</button>';
  const rows = [];
  if (!(c && c.level === 'planned')) rows.push(btn('dayDo', ico('check', 18) + 'Обычная версия' + (h.planned ? ': ' + esc(h.planned) : ''), 'primary', ' data-level="planned"'));
  if (h.minimal && !(c && c.level === 'min')) rows.push(btn('dayDo', ico('check', 18) + 'Минимум: ' + esc(h.minimal), 'soft', ' data-level="min"'));
  if (c && h.extra) rows.push(btn('dayExtra', (exDone ? ico('check', 18) : ico('plus', 18)) + esc(h.extra), exDone ? 'soft' : 'ghost'));
  let amt = '';
  if (c && h.unit) amt = '<div class="amt-row"><label class="fld"><span>Сколько, ' + esc(h.unit.label) + '</span><input id="day-amount" type="number" inputmode="numeric" min="0" max="9999" value="' + (c.amount || '') + '"></label>' + btn('dayAmount', 'Сохранить', 'soft') + '</div>';
  const skipBlock = c ? '' : (skipped ? btn('dayUnskip', 'Вернуть из отдыха', 'ghost')
    : '<div class="skip-box"><b>' + (weekly ? 'Отдых на эту неделю' : 'Не в этот день') + '</b><p class="muted small">Отдых не прерывает серию и не отнимает прогресс.</p><div class="chips">' + Object.keys(C.skipReasons).map(k => '<button class="chip" data-act="daySkip" data-id="' + h.id + '" data-day="' + day + '" data-reason="' + k + '">' + C.skipReasons[k] + '</button>').join('') + '</div></div>');
  const clear = c ? btn('dayClear', ico('undo', 18) + 'Снять отметку', 'ghost') : '';

    + '<div class="stack">' + rows.join('') + amt + clear + skipBlock + '</div>'
    + '<div class="row wrap between sheet-links"><a class="link" href="#habit-' + h.id + '" data-go="habit-' + h.id + '">Открыть карточку</a><button class="link-btn" data-act="editHabit" data-id="' + h.id + '">' + ico('edit', 14) + 'Изменить привычку</button></div>';
  return shell(esc(h.name) + '<small>' + (isToday ? 'Сегодня, ' : '') + fmtLong(day) + '</small>', body, '', 'compact');
}

      + '<label class="fld"><span>Как к тебе обращаться?</span><input type="text" id="wz-name" data-wz="name" value="' + esc(w.name) + '" maxlength="30" placeholder="Необязательно"></label>'
      + '<div class="fld"><span>Режим</span><div class="seg wide"><button type="button" class="' + (w.game ? 'on' : '') + '" data-act="wzMode" data-val="1">Игровой</button><button type="button" class="' + (!w.game ? 'on' : '') + '" data-act="wzMode" data-val="0">Спокойный трекер</button></div><em>' + (w.game ? 'Опыт, уровни, сад, квесты и награды. Всё это можно выключить позже без потери данных.' : 'Только привычки и аналитика. Игру можно включить позже в настройках.') + '</em></div>';
    foot = '<button class="btn ghost" data-act="wzSkip">Настрою сам(а)</button><button class="btn primary" data-act="wzNext">Дальше</button>';
  } else if (w.step === 1) {
    const ids = C.templateOrder.filter(id => id !== 'custom');
    body = dots + '<h3>Кем ты хочешь стать?</h3><p class="muted small">Выбери одну-две идентичности (максимум три). Лучше начать с малого.</p><ul class="tplgrid">' + ids.map(id => { const t = C.templates[id], on = w.tpls.indexOf(id) >= 0; return '<li><button class="tpl' + (on ? ' on' : '') + '" data-act="wzTpl" data-val="' + id + '" aria-pressed="' + on + '" style="--hc:' + hexOf(t.color) + '">' + plantSvg(t.plant, hexOf(t.color), 46) + '<b>' + esc(t.label) + '</b><span class="muted small">' + esc(t.statement) + '</span>' + (on ? '<i class="tick">' + ico('check', 14) + '</i>' : '') + '</button></li>'; }).join('') + '</ul>';
    foot = '<button class="btn ghost" data-act="wzBack">Назад</button><button class="btn primary" data-act="wzNext"' + (w.tpls.length ? '' : ' disabled') + '>Дальше</button>';
  } else {
    body = (w.attach ? '' : dots) + '<h3>' + (w.attach ? 'Готовые привычки' : 'Стартовые привычки') + '</h3><p class="muted small">Начни с одной-двух. У каждой есть версия на две минуты. Всё можно изменить позже.</p>'
      + w.tpls.map(id => { const t = C.templates[id]; return '<section class="wz-group" style="--hc:' + hexOf(t.color) + '"><h4><span class="dot"></span>' + esc(t.statement) + '</h4><ul class="wz-list">' + t.starters.map((st, k) => { const on = (w.picks[id] || []).indexOf(k) >= 0; return '<li><button class="wz-pick' + (on ? ' on' : '') + '" data-act="wzStarter" data-tpl="' + id + '" data-idx="' + k + '" aria-pressed="' + on + '"><span class="box">' + (on ? ico('check', 14) : '') + '</span><span><b>' + esc(st.name) + '</b><em>' + schedLabel(st) + (st.minimal ? ' · минимум: ' + esc(st.minimal) : '') + '</em></span></button></li>'; }).join('') + '</ul></section>'; }).join('');
    const n = w.tpls.reduce((s2, id) => s2 + (w.picks[id] || []).length, 0);
    foot = (w.attach ? '<button class="btn ghost" data-act="closeLayer">Отмена</button>' : '<button class="btn ghost" data-act="wzBack">Назад</button>') + '<button class="btn primary" data-act="wzFinish"' + (w.attach && !n ? ' disabled' : '') + '>' + (w.attach ? 'Добавить: ' + n : n ? 'Начать: ' + n + ' ' + plural(n, ['привычка', 'привычки', 'привычек']) : 'Начать без привычек') + '</button>';
  }
  return shell(w.attach ? 'Добавить привычки' : 'Добро пожаловать', body, foot, 'tall wizard');
}

/* ============================================================================
 * РОСТОК — события, действия, пример данных, запуск
 * ========================================================================== */

/* ---------- общие помощники ---------- */
function notifyRep(rep) {
  if (!rep || !isGame()) return;
  (rep.newAch || []).forEach(id => { const d = R.achievementIndex[id]; if (d) toast({ badge: Art.badge(d, true, 40), text: 'Достижение: ' + esc(d.title), sub: esc(d.desc) + ' · +' + d.sparks + ' ✦', kind: 'ach', ttl: 7000, action: { label: 'Смотреть', act: 'go', args: { to: 'awards' } } }); });
  (rep.questsDone || []).forEach(q => toast({ icon: 'flag', text: 'Квест выполнен', sub: esc(q.title) + ' · +' + (E.RULES.sparks.quest[q.kind] || 0) + ' ✦' }));
  if (rep.levelUp) ui.modal = { type: 'level', from: rep.levelUp.from, to: rep.levelUp.to };
}
function after(rep, okText, sub) {
  save();
  if (okText) toast({ icon: 'check', text: okText, sub: sub || '', ttl: 3500 });
  notifyRep(rep);
  render();
}
function rerenderLayer(el, opt) {
  const body = $('#layer .sheet-body'), sc = body ? body.scrollTop : 0, d = el && el.dataset;
  const sel = d && d.act ? '[data-act="' + d.act + '"]' + (d.val != null ? '[data-val="' + d.val + '"]' : '') + (d.idx != null ? '[data-idx="' + d.idx + '"][data-tpl="' + d.tpl + '"]' : '') : null;
  renderLayer();
  const b2 = $('#layer .sheet-body'); if (b2) b2.scrollTop = opt && opt.top ? 0 : sc;
  let n = null; try { n = sel ? document.querySelector('#layer ' + sel) : null; } catch (e) { /* селектор */ }
  if (!n) n = document.querySelector('#layer .sheet-foot .btn.primary');
  if (n) { try { n.focus({ preventScroll: true }); } catch (e) { /* фокус */ } }
}
function updatePreview() { const p = $('#habit-preview p'); if (p && ui.draft) p.innerHTML = previewSentence(ui.draft); }
function setDraftErr(msg, field) {
  ui.draft.err = msg; if (ui.sheet) ui.sheet.focus = field || null;
  const body = $('#layer .sheet-body'), sc = body ? body.scrollTop : 0;
  layerSig = ''; renderLayer();
  const b = $('#layer .sheet-body'); if (b) b.scrollTop = 0; void sc;
  const er = $('#layer .err'); if (er && er.scrollIntoView) { try { er.scrollIntoView({ block: 'nearest' }); } catch (e) { /* без прокрутки */ } }
}
function openHabitEditor(h, preset, focus, simplify) {
  ui.draft = habitDraft(h, preset); ui.draft.simplify = !!simplify;
  openSheet({ type: 'habit', id: h ? h.id : null, focus: focus || (h ? null : 'name') });
}
function counts(st) { return { habits: st.habits.filter(h => !h.deleted).length, identities: st.identities.length, completions: st.completions.length }; }

/* ---------- действия ---------- */
const acts = {};

// навигация и общее
acts.go = (el, a) => go(a.to);
acts.toastClose = el => dismissToast(el.dataset.toast);
acts.closeLayer = () => {

  const s = ui.sheet;
  if (s && s.type === 'wizard' && ui.wizard && !ui.wizard.attach) { S.onboarded = true; save(); }
  if (s && s.type === 'identity' && s.returnTo && ui.pendingHabit) { ui.draft = ui.pendingHabit; ui.pendingHabit = null; ui.sheet = { type: 'habit', id: ui.draft.id }; layerSig = ''; renderLayer(); return; }
  ui.sheet = null; ui.draft = null; if (s && s.type === 'wizard') ui.wizard = null;
  renderLayer(); if (s && s.type === 'wizard') render();
};
acts.closeModal = () => { ui.modal = null; ui.confirm = null; renderLayer(); };
acts.confirmNo = () => { ui.confirm = null; renderLayer(); };
acts.confirmYes = () => { const c = ui.confirm; ui.confirm = null; renderLayer(); if (c && c.run) c.run(); };
acts.copyNow = async () => {

acts.toggleArch = () => { ui.showArchived = !ui.showArchived; render(); };
acts.gardenView = (el) => { ui.rootsView = el.dataset.val === 'roots'; render(); };
acts.achFilter = el => { ui.achFilter = el.dataset.val; render(); };

acts.statsRange = el => { ui.statsRange = el.dataset.val; render(); };
acts.shopTab = el => { ui.shopTab = el.dataset.val; render(); };

acts.startWizard = () => { wizardInit(); openSheet({ type: 'wizard' }); };

// отметки
acts.check = (el) => {
  const id = el.dataset.id, st = X.hstats.get(id);

};
acts.minCheck = el => doComplete(el.dataset.id, 'min', X.today, el);
acts.undoDone = (el, a) => doUncomplete(a.id, a.day);
acts.extra = el => {
  const id = el.dataset.id, h = habitById(id);
  const rep = A.toggleExtra(S, id, X.today, nowTs());
  if (!rep.ok) { toast({ icon: 'info', text: ERR[rep.error] || 'Не получилось' }); return; }
  const on = X.ix.extra.has(id + '|' + X.today) ? false : true;
  const e = rep.event;
  save();
  if (on && h) { toast({ icon: 'plus', text: (isGame() && e && e.xp ? '+' + e.xp + ' XP · ' : 'Записано · ') + esc(h.extra), kind: e && e.xp ? 'good' : '', ttl: 3500 }); if (e && e.xp) floatChip(el, '+' + e.xp + ' XP'); }
  notifyRep(rep); render();
};
acts.rowMenu = el => openSheet({ type: 'day', id: el.dataset.id, day: X.today });
acts.daySheet = el => openSheet({ type: 'day', id: el.dataset.id, day: el.dataset.day });
acts.dayDo = el => { const id = el.dataset.id, day = el.dataset.day, lv = el.dataset.level; ui.sheet = null; renderLayer(); doComplete(id, lv, day); };
acts.dayExtra = el => {
  const rep = A.toggleExtra(S, el.dataset.id, el.dataset.day, nowTs());

acts.daySkip = el => {
  const rep = A.skipDay(S, el.dataset.id, el.dataset.day, el.dataset.reason, nowTs());

};
acts.dayUnskip = el => { const rep = A.unskip(S, el.dataset.id, el.dataset.day, nowTs()); ui.sheet = null; after(rep, 'Отметка отдыха снята'); };

// привычки
acts.newHabit = el => openHabitEditor(null, { identityId: (el && el.dataset && el.dataset.ident) || '' });
acts.editHabit = el => { const h = habitById(el.dataset.id); if (h) openHabitEditor(h, null, el.dataset.focus || null); };
acts.suggest = el => { const h = habitById(el.dataset.id); if (h) openHabitEditor(h, null, el.dataset.focus || null, el.dataset.simplify === '1'); };
acts.archiveHabit = el => {
  const h = habitById(el.dataset.id); if (!h) return;
  const rep = A.archiveHabit(S, h.id, !h.archived, nowTs()); save();
  toast({ icon: 'check', text: h.archived ? 'Привычка в архиве' : 'Привычка возвращена', sub: h.archived ? 'История и опыт сохранены' : '', ttl: 3000 });
  void rep; go('habits');
};
acts.deleteHabit = el => {
  const h = habitById(el.dataset.id); if (!h) return;
  confirmDlg({ title: 'Удалить привычку?', text: '«' + esc(h.name) + '» исчезнет из списков. Прошлые выполнения и накопленный опыт сохранятся. Если хочешь пока отложить её, лучше убрать в архив.', ok: 'Удалить', danger: true, run: () => { A.deleteHabit(S, h.id, nowTs()); save(); toast({ icon: 'check', text: 'Привычка удалена', ttl: 3000 }); go('habits'); } });
};
acts.dKind = (el) => { ui.draft.kind = el.dataset.val; ui.draft.err = ''; rerenderLayer(el); };
acts.dSched = (el) => { ui.draft.schedType = el.dataset.val; rerenderLayer(el); };
acts.dDay = (el) => { const n = +el.dataset.val, d = ui.draft.days, i = d.indexOf(n); if (i >= 0) d.splice(i, 1); else d.push(n); d.sort(); rerenderLayer(el); };
acts.dTimes = (el) => { ui.draft.times = Math.max(1, Math.min(7, ui.draft.times + (+el.dataset.val))); const o = $('#times-out'); if (o) o.textContent = ui.draft.times + ' ' + plural(ui.draft.times, ['раз', 'раза', 'раз']) + ' в неделю'; };
acts.dUnit = (el) => { ui.draft.unitOn = !ui.draft.unitOn; rerenderLayer(el); };
acts.saveHabit = () => {
  const d = ui.draft, av = d.kind === 'avoid';
  if (!d.name.trim()) { setDraftErr('Дай привычке название.', 'name'); return; }
  if (d.schedType === 'days' && !d.days.length) { setDraftErr('Выбери хотя бы один день недели.', 'schedule'); return; }
  if (!av && d.unitOn && !String(d.unitLabel).trim()) { setDraftErr('Укажи единицу объёма: например, минуты.', 'unitLabel'); return; }
  const num = v => { const n = parseFloat(v); return n > 0 ? n : null; };
  const patch = {
    name: d.name, planned: d.planned.trim() || (av ? '' : d.name), minimal: d.minimal, extra: av ? '' : d.extra, identityId: d.identityId || null, kind: d.kind,
    unit: !av && d.unitOn ? { label: String(d.unitLabel).trim(), planned: num(d.unitPlanned), min: num(d.unitMin) } : null,
    schedule: { type: d.schedType, days: d.days, times: d.times },
    design: { time: d.time, place: d.place.trim(), stack: d.stack.trim(), prepare: d.prepare.trim(), bundle: d.bundle.trim(), why: d.why.trim(), reward: d.reward.trim(), recovery: d.recovery.trim(), hide: d.hide.trim(), friction: d.friction.trim() }
  };
  const now = nowTs(); let rep, msg;
  if (d.id) { rep = A.updateHabit(S, d.id, patch, now, { simplified: d.simplify, note: 'Привычка упрощена' }); msg = 'Привычка сохранена'; }
  else { rep = A.addHabit(S, patch, now); msg = 'Привычка создана'; }
  if (!rep.ok) { setDraftErr('Не получилось сохранить.', null); return; }
  ui.sheet = null; ui.draft = null;
  after(rep, msg, d.name.trim());
};

// идентичности
acts.newIdentity = () => { ui.draft = identityDraft(null); openSheet({ type: 'identity', id: null }); };
acts.newIdentityFromSheet = () => { ui.pendingHabit = ui.draft; ui.draft = identityDraft(null); ui.sheet = { type: 'identity', id: null, returnTo: 'habit' }; layerSig = ''; renderLayer(); };
acts.editIdentity = el => { const i = identityById(el.dataset.id); if (i) { ui.draft = identityDraft(i); openSheet({ type: 'identity', id: i.id }); } };
acts.pickTpl = el => { ui.draft = identityDraft(null, el.dataset.val); if (el.dataset.val === 'custom') ui.sheet.focus = 'name'; rerenderLayer(el, { top: true }); if (el.dataset.val === 'custom') { const n = $('#f-name'); if (n) n.focus(); } };
acts.idBack = el => { ui.draft = identityDraft(null); rerenderLayer(el, { top: true }); };
acts.idColor = el => { ui.draft.color = el.dataset.val; rerenderLayer(el); };
acts.idPlant = el => { ui.draft.plant = el.dataset.val; rerenderLayer(el); };
acts.saveIdentity = () => {
  const d = ui.draft;
  if (!d.name.trim()) { setDraftErr('Назови идентичность: кем ты становишься?', 'name'); return; }
  const now = nowTs(); let rep;
  if (d.id) {
    rep = A.updateIdentity(S, d.id, { name: d.name, statement: d.statement, desc: d.desc, color: d.color, plant: d.plant, stageTitles: d.titles, stageGoals: d.goals, stageTargets: d.targets }, now);
    ui.sheet = null; ui.draft = null; after(rep, 'Идентичность сохранена'); return;
  }
  rep = A.addIdentity(S, { tpl: d.tpl, name: d.name, statement: d.statement, desc: d.desc, color: d.color, plant: d.plant }, now);
  save();
  if (ui.sheet && ui.sheet.returnTo && ui.pendingHabit) {
    ui.draft = ui.pendingHabit; ui.pendingHabit = null; ui.draft.identityId = rep.identity.id; ui.sheet = { type: 'habit', id: ui.draft.id }; layerSig = ''; renderLayer(); render(); return;
  }
  ui.sheet = null; ui.draft = null;
  toast({ icon: 'sprout', text: 'Идентичность добавлена', sub: 'Теперь привяжи к ней привычки', kind: 'good', ttl: 4500 });
  notifyRep(rep); go('identity-' + rep.identity.id);
};
acts.archiveIdentity = el => {
  const i = identityById(el.dataset.id); if (!i) return;
  const rep = A.updateIdentity(S, i.id, { archived: !i.archived }, nowTs());
  ui.sheet = null; ui.draft = null; after(rep, i.archived ? 'Идентичность возвращена' : 'Идентичность в архиве', 'Привычки и история сохранены');
  if (!i.archived) return; go('path');
};
acts.pickStage = el => openSheet({ type: 'stage', id: el.dataset.id });
acts.setStage = el => {
  const rep = A.setStage(S, el.dataset.id, +el.dataset.val, nowTs());
  ui.sheet = null; after(rep, 'Этап выбран вручную', 'История этапов сохранена');
};
acts.completeStage = el => {
  const i = identityById(el.dataset.id);
  const rep = A.completeStage(S, el.dataset.id, nowTs());
  if (!rep.ok) { toast({ icon: 'info', text: 'Критерии этапа ещё не выполнены' }); return; }
  after(rep, 'Этап пройден', i ? 'Новый этап: «' + (R.stageInfo(i, Math.min(i.stage, 4)).title) + '»' : '');
};
acts.addStarters = el => {
  const i = identityById(el.dataset.id), t = i && C.templates[i.tpl]; if (!t || !t.starters.length) return;
  ui.wizard = { step: 2, attach: i.id, game: S.settings.game, name: '', tpls: [i.tpl], picks: {} }; ui.wizard.picks[i.tpl] = [0];
  openSheet({ type: 'wizard' });
};

// онбординг
acts.wzMode = el => { ui.wizard.game = el.dataset.val === '1'; rerenderLayer(el); };
acts.wzTpl = el => {
  const w = ui.wizard, id = el.dataset.val, i = w.tpls.indexOf(id);
  if (i >= 0) w.tpls.splice(i, 1); else { if (w.tpls.length >= 3) { toast({ icon: 'info', text: 'Лучше начать с двух-трёх идентичностей', ttl: 2800 }); return; } w.tpls.push(id); }
  rerenderLayer(el);
};
acts.wzStarter = el => {
  const w = ui.wizard, id = el.dataset.tpl, k = +el.dataset.idx; const l = w.picks[id] = w.picks[id] || [], i = l.indexOf(k);
  if (i >= 0) l.splice(i, 1); else l.push(k);
  rerenderLayer(el);
};
acts.wzNext = el => {
  const w = ui.wizard;
  if (w.step === 1) w.tpls.forEach(id => { if (!w.picks[id]) w.picks[id] = [0]; });
  w.step = Math.min(2, w.step + 1); rerenderLayer(el, { top: true });
};
acts.wzBack = el => { ui.wizard.step = Math.max(0, ui.wizard.step - 1); rerenderLayer(el, { top: true }); };
acts.wzSkip = () => { S.onboarded = true; save(); ui.sheet = null; ui.wizard = null; renderLayer(); render(); };
acts.wzFinish = () => {
  const w = ui.wizard, now = nowTs(); let n = 0;
  if (w.attach) {
    const t = C.templates[w.tpls[0]];
    (w.picks[w.tpls[0]] || []).forEach(k => { A.addHabit(S, Object.assign({}, t.starters[k], { identityId: w.attach }), now); n++; });
    ui.sheet = null; ui.wizard = null; const rep = E.commit(S, now); after(rep, 'Добавлено привычек: ' + n); return;
  }
  A.setSetting(S, { name: (w.name || '').trim(), game: !!w.game }, now);
  w.tpls.forEach(id => {
    const t = C.templates[id], ident = A.addIdentity(S, { tpl: id, name: t.label, statement: t.statement, desc: t.desc, color: t.color, plant: t.plant }, now).identity;
    (w.picks[id] || []).forEach(k => { A.addHabit(S, Object.assign({}, t.starters[k], { identityId: ident.id }), now); n++; });
  });
  S.onboarded = true; const rep = E.commit(S, now);
  ui.sheet = null; ui.wizard = null; save();
  go('home');
  toast({ icon: 'sprout', text: n ? 'Всё готово: добавлено привычек ' + n : 'Всё готово', sub: n ? 'Отметь первую сегодня: достаточно версии на две минуты' : 'Создай первую привычку на главной', kind: 'good', ttl: 6000 });
  notifyRep(rep); render();
};

// квесты
acts.questToggle = el => { const rep = A.questManual(S, el.dataset.id, nowTs()); after(rep); };
acts.questDismiss = el => { const rep = A.questDismiss(S, el.dataset.id, nowTs()); after(rep, 'Квест убран', 'Новый появится позже, без штрафов'); };
acts.setQuests = el => { const rep = A.setSetting(S, { quests: el.dataset.val }, nowTs()); after(rep); };

// обзор недели
acts.revStep = el => { ui.review.step = Math.max(0, Math.min(3, +el.dataset.val)); window.scrollTo(0, 0); render(); };
acts.revBlocker = el => { ui.review.blocker = ui.review.blocker === el.dataset.val ? '' : el.dataset.val; render(); };
acts.revWeek = el => { reviewInit(el.dataset.val); render(); };
acts.saveReview = () => {

  toast({ icon: 'check', text: 'Обзор недели сохранён', sub: rep.first && isGame() && rep.event && rep.event.xp ? '+' + rep.event.xp + ' XP · +' + (rep.event.sparks || 0) + ' ✦' : '', kind: 'good', ttl: 4500 });

};

// среда
acts.envTab = el => { ui.envTab = el.dataset.val; render(); };
acts.envKind = el => { ui.envKind = el.dataset.val; render(); };
acts.envChip = el => { const i = $('#env-text'); if (i) { i.value = el.dataset.val; i.focus(); } };
acts.envToggle = el => {

  else if (e && isGame() && e.note === 'weekCap') toast({ icon: 'info', text: 'Задача отмечена', sub: 'Награды за среду на этой неделе уже получены', ttl: 3500 });
  notifyRep(rep); render();
};
acts.envRemove = el => { const rep = A.removeEnv(S, el.dataset.id, nowTs()); after(rep); };
acts.score = el => { A.markScore(S, el.dataset.id, el.dataset.val); save(); render(); };
acts.scoreRemove = el => { A.removeScore(S, el.dataset.id); save(); render(); };
acts.scoreMake = el => { const s = S.scorecard.find(x => x.id === el.dataset.id); if (s) openHabitEditor(null, { name: s.text.length > 60 ? s.text.slice(0, 60) : s.text, kind: s.mark === '-' ? 'avoid' : 'build' }); };

// профиль и магазин
acts.buy = el => {
  const it = C.shopIndex[el.dataset.id]; const rep = A.buy(S, el.dataset.id, nowTs());

acts.equip = el => {

  A.setSetting(S, patch, nowTs()); save(); render();
